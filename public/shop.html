<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Sole Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { vault: { black:'#0a0a0a', charcoal:'#161616', smoke:'#262626', gold:'#c9a961', cream:'#f5f1e8' } },
        fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['"Space Grotesk"','Inter','sans-serif'] }
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-vault-black text-vault-cream font-sans antialiased">

  <!-- NAVBAR (same as index) -->
  <header class="fixed top-0 left-0 right-0 z-40 backdrop-blur-md bg-vault-black/70 border-b border-white/5">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="/" class="font-display text-2xl font-bold tracking-tight">Sole<span class="text-vault-gold">Vault</span></a>
      <ul class="hidden md:flex items-center gap-8 text-sm text-vault-cream/70">
        <li><a href="/shop.html" class="text-vault-gold">Shop</a></li>
        <li><a href="/about.html" class="hover:text-vault-gold transition">About</a></li>
        <li><a href="/contact.html" class="hover:text-vault-gold transition">Contact</a></li>
      </ul>
      <a href="https://wa.me/254704587404?text=Hi%20Sole%20Vault" target="_blank" rel="noopener"
         class="hidden sm:inline-flex items-center gap-2 bg-vault-gold text-vault-black text-sm font-semibold px-4 py-2 rounded-full hover:bg-vault-cream transition">
        Order on WhatsApp
      </a>
    </nav>
  </header>

  <!-- HEADER -->
  <section class="pt-32 pb-12 px-6">
    <div class="max-w-7xl mx-auto">
      <p class="text-vault-gold text-sm font-medium tracking-widest uppercase mb-3">The Collection</p>
      <h1 class="font-display text-5xl md:text-6xl font-bold">All sneakers</h1>
      <p class="text-vault-cream/50 mt-3">Authenticated pairs. Delivered countrywide.</p>
    </div>
  </section>

  <!-- FILTERS (placeholder) -->
  <section class="px-6 pb-8">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-3 text-sm">
      <button data-filter="all" class="filter-btn active px-4 py-2 rounded-full border border-vault-gold text-vault-gold">All</button>
      <button data-filter="low-top" class="filter-btn px-4 py-2 rounded-full border border-white/10 text-vault-cream/70 hover:border-vault-gold hover:text-vault-gold transition">Low-top</button>
      <button data-filter="high-top" class="filter-btn px-4 py-2 rounded-full border border-white/10 text-vault-cream/70 hover:border-vault-gold hover:text-vault-gold transition">High-top</button>
      <button data-filter="runner" class="filter-btn px-4 py-2 rounded-full border border-white/10 text-vault-cream/70 hover:border-vault-gold hover:text-vault-gold transition">Runner</button>
      <button data-filter="trail" class="filter-btn px-4 py-2 rounded-full border border-white/10 text-vault-cream/70 hover:border-vault-gold hover:text-vault-gold transition">Trail</button>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <section class="px-6 pb-24">
    <div class="max-w-7xl mx-auto">
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- filled by JS -->
      </div>
      <p id="loading" class="text-center text-vault-cream/40 py-12">Loading products…</p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-white/5 px-6 py-12 text-sm text-vault-cream/50">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-6">
      <div>
        <p class="font-display text-xl font-bold text-vault-cream mb-2">Sole<span class="text-vault-gold">Vault</span></p>
        <p>Premium sneakers · Nairobi, Kenya</p>
      </div>
      <p>© 2026 Sole Vault. All rights reserved.</p>
    </div>
  </footer>

  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/254704587404?text=Hi%20Sole%20Vault%2C%20I%27m%20interested%20in%20your%20sneakers"
     target="_blank" rel="noopener" aria-label="Chat on WhatsApp"
     class="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-[#25D366] text-white font-semibold px-4 py-3 rounded-full shadow-2xl shadow-[#25D366]/40 hover:scale-105 transition-transform">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </svg>
    <span class="hidden sm:inline">Chat on WhatsApp</span>
  </a>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const grid = document.getElementById("product-grid");
      const loading = document.getElementById("loading");
      try {
        const products = await SV.loadProducts();
        loading.remove();
        render(products);

        // Filter buttons
        const buttons = document.querySelectorAll(".filter-btn");
        buttons.forEach(btn => {
          btn.addEventListener("click", () => {
            buttons.forEach(b => {
              b.classList.remove("active", "border-vault-gold", "text-vault-gold");
              b.classList.add("border-white/10", "text-vault-cream/70");
            });
            btn.classList.add("active", "border-vault-gold", "text-vault-gold");
            btn.classList.remove("border-white/10", "text-vault-cream/70");

            const f = btn.dataset.filter;
            const filtered = f === "all" ? products : products.filter(p => p.category === f);
            render(filtered);
          });
        });

        function render(list) {
          grid.innerHTML = list.map(p => SV.productCardHtml(p)).join("");
        }
      } catch (err) {
        loading.textContent = "Failed to load products: " + err.message;
      }
    })();
  </script>

</body>
</html>
