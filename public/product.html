<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Sole Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { vault: { black:'#0a0a0a', charcoal:'#161616', smoke:'#262626', gold:'#c9a961', cream:'#f5f1e8' } },
        fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['"Space Grotesk"','Inter','sans-serif'] }
      }}
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-vault-black text-vault-cream font-sans antialiased">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 right-0 z-40 backdrop-blur-md bg-vault-black/70 border-b border-white/5">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="/" class="font-display text-2xl font-bold tracking-tight">Sole<span class="text-vault-gold">Vault</span></a>
      <ul class="hidden md:flex items-center gap-8 text-sm text-vault-cream/70">
        <li><a href="/shop.html" class="hover:text-vault-gold transition">Shop</a></li>
        <li><a href="/about.html" class="hover:text-vault-gold transition">About</a></li>
        <li><a href="/contact.html" class="hover:text-vault-gold transition">Contact</a></li>
      </ul>
      <div class="flex items-center gap-4">
        <button data-open-cart class="relative p-2 text-vault-cream/70 hover:text-vault-gold transition" aria-label="Open cart">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
          </svg>
          <span data-cart-count class="hidden absolute -top-1 -right-1 bg-vault-gold text-vault-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
        <a href="https://wa.me/254704587404"
           target="_blank" rel="noopener"
           class="hidden sm:inline-flex items-center gap-2 bg-vault-gold text-vault-black text-sm font-semibold px-4 py-2 rounded-full hover:bg-vault-cream transition">
          Order on WhatsApp
        </a>
      </div>
    </nav>
  </header>

  <!-- PRODUCT DETAIL -->
  <section class="pt-32 pb-24 px-6">
    <div id="root" class="max-w-7xl mx-auto"></div>
  </section>

  <!-- CART OVERLAY + DRAWER -->
  <div id="cart-overlay" class="hidden fixed inset-0 bg-black/60 z-40"></div>

  <aside id="cart-drawer"
         class="fixed top-0 right-0 h-full w-full max-w-md bg-vault-charcoal z-50 translate-x-full transition-transform duration-300 flex flex-col">
    <div class="flex items-center justify-between px-6 py-5 border-b border-white/5">
      <h2 class="font-display text-xl font-bold">Your cart</h2>
      <button data-close-cart class="text-vault-cream/60 hover:text-vault-cream text-2xl leading-none">×</button>
    </div>
    <div data-cart-body class="flex-1 overflow-y-auto px-6"></div>
    <div data-cart-footer class="px-6 py-5 border-t border-white/5"></div>
  </aside>

  <!-- FLOATING WHATSAPP -->
  <a href="https://wa.me/254704587404" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"
     class="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-[#25D366] text-white font-semibold px-4 py-3 rounded-full shadow-2xl shadow-[#25D366]/40 hover:scale-105 transition-transform">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </svg>
    <span class="hidden sm:inline">Chat on WhatsApp</span>
  </a>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const root = document.getElementById("root");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        root.innerHTML = `<p class="text-center text-vault-cream/50 py-24">No product selected. <a href="/shop.html" class="text-vault-gold underline">Back to shop</a></p>`;
        return;
      }

      const product = await SV.getProductById(id);
      if (!product) {
        root.innerHTML = `<p class="text-center text-vault-cream/50 py-24">Product not found. <a href="/shop.html" class="text-vault-gold underline">Back to shop</a></p>`;
        return;
      }

      document.title = product.name + " — Sole Vault";

      root.innerHTML = `
        <div class="grid md:grid-cols-2 gap-12 items-start">
          <div class="aspect-square bg-vault-charcoal rounded-3xl overflow-hidden">
            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover" />
          </div>
          <div>
            <a href="/shop.html" class="text-vault-cream/50 text-sm hover:text-vault-gold transition">← Back to shop</a>
            <h1 class="font-display text-4xl md:text-5xl font-bold mt-4 mb-2">${product.name}</h1>
            <p class="text-vault-cream/50 mb-6">${product.brand}</p>

            <div class="flex items-baseline gap-3 mb-6">
              <span class="font-display text-3xl font-bold text-vault-gold">${SV.formatKsh(product.priceKsh)}</span>
              <span class="text-vault-cream/40">${SV.formatUsd(product.priceUsd)}</span>
            </div>

            <p class="text-vault-cream/70 leading-relaxed mb-8">${product.description}</p>

            <div class="mb-8">
              <p class="text-sm text-vault-cream/50 mb-3">Available sizes (EU)</p>
              <div class="flex flex-wrap gap-2">
                ${product.sizes.map(s => `<button class="size-btn px-4 py-2 rounded-full border border-white/10 text-sm hover:border-vault-gold hover:text-vault-gold transition">${s}</button>`).join("")}
              </div>
            </div>

            <p class="text-sm text-vault-cream/50 mb-6">${product.stock} pairs in stock</p>

            <div class="flex flex-wrap gap-3">
              <button id="add-to-cart" class="inline-flex items-center gap-2 bg-vault-cream text-vault-black font-semibold px-6 py-3 rounded-full hover:bg-vault-gold transition">
                Add to cart
              </button>
              <a href="${SV.waProductLink(product)}" target="_blank" rel="noopener"
                 class="inline-flex items-center gap-2 bg-[#25D366] text-white font-semibold px-6 py-3 rounded-full hover:opacity-90 transition">
                Order this on WhatsApp
              </a>
            </div>
          </div>
        </div>
      `;

      // Size selection
      let selectedSize = null;
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("bg-vault-gold","text-vault-black","border-vault-gold"));
          btn.classList.add("bg-vault-gold","text-vault-black","border-vault-gold");
          selectedSize = btn.textContent;
        });
      });

      // Add to cart
      document.getElementById("add-to-cart").addEventListener("click", () => {
        if (!selectedSize) {
          alert("Please select a size first.");
          return;
        }
        SV.addToCart(product, selectedSize, 1);
        SV.openCartDrawer();
      });
    })();
  </script>

</body>
</html>
